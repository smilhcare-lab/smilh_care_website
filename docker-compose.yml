services:
  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-certs:/etc/letsencrypt:ro          # SSL certs from Certbot
      - certbot-webroot:/var/www/certbot:ro         # Certbot challenge files
    depends_on:
      flask:
        condition: service_healthy
    restart: always
    networks:
      - smilh-net

  flask:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env
    expose:
      - "5000"                # internal only — Nginx proxies, no public port needed
    restart: always
    networks:
      - smilh-net
    extra_hosts:
      - "host.docker.internal:host-gateway"        # reach Ollama running on VPS host
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  uptime-kuma:
    image: louislam/uptime-kuma:1
    ports:
      - "3001:3001"           # access at http://your-vps-ip:3001
    volumes:
      - uptime-kuma:/app/data
    restart: always
    networks:
      - smilh-net

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-certs:/etc/letsencrypt                # shared with nginx
      - certbot-webroot:/var/www/certbot              # shared with nginx
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"
    restart: always

volumes:
  uptime-kuma:
  certbot-certs:
  certbot-webroot:

networks:
  smilh-net:
    driver: bridge